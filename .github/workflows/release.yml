name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty. Set up signing secrets before releasing."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter pub get

      - run: flutter analyze
      - run: flutter test

      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      # Google Play takes an app bundle, not an APK. It is kept off the
      # release page - IzzyOnDroid reads the APKs from there - and left as a
      # run artifact to upload to the Play Console by hand.
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Release notes from the store changelog
        id: notes
        run: |
          code=$(grep -oP '^version:.*\+\K[0-9]+' pubspec.yaml)
          file="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ -f "$file" ]; then
            {
              echo 'body<<TALLY_EOF'
              cat "$file"
              echo TALLY_EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
